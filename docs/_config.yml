# Site settings
title: WinForge
description: Windows 11 Optimization Tool
bio: "Forge Your Windows, Effortlessly. 🚀"
url: "https://junksidetm.github.io"
baseurl: "/WinForge"
picture: assets/images/profile.jpg

# Social handles
github: mrdarksidetm/WinForge
email: contact.dsidetm@gmail.com
twitter: mrdarksidetm

# Theme settings
dark-theme: auto # "auto", true, or false
animation: true
blog: true
projects: true
about: true
width: large

# Theme (remote GitHub repo)
remote_theme: sergiokopplin/indigo

# Build settings
plugins:
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-sitemap
  - jekyll-seo-tag

# Pagination (v3.0+ compat)
pagination:
  enabled: true
  per_page: 5
  permalink: "/page/:num/"
  title: " - Page :num"  # Replaces deprecated title_suffix

# Sass config to suppress deprecations (via jekyll-sass-converter)
sass:
  style: compressed
  quiet_deps: true
  silence_deprecations: ['import']
  incremental: true

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
